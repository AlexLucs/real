<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBC-Br por mês</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500&display=swap">
<style>
/* Layout: título, barra de controles, tabela no padrão visual do site do BCB.
   Tema: o script sempre define data-theme="light"|"dark" no <html>
   (no modo Automático, segue o sistema), então só existe um bloco de cores escuras. */
:root{
  --bg:#ffffff; --fg:#3b3b3b; --muted:#6b7378;
  --band:#0f5d70; --band-fg:#ffffff;
  --row:#f1f1f1; --line:#9fbfc8;
  --bad-bg:#fde2e1; --bad-fg:#a1261d;
  --font:"Ubuntu","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#15191b; --fg:#e3e6e7; --muted:#9aa4a8;
  --band:#0f5d70; --band-fg:#ffffff;
  --row:#1f2527; --line:#3b5c66;
  --bad-bg:#4a1f1c; --bad-fg:#ffb4ab;
  color-scheme:dark;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px}
h1{font-weight:500;font-size:1.5rem;margin:0 0 16px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:8px}
.ctrl .push{margin-left:auto}
select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
button{cursor:pointer}
select:disabled,button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--band);outline-offset:2px}
#status{color:var(--muted);font-size:.9rem;min-height:1.4em;margin-bottom:12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.band th{background:var(--band);color:var(--band-fg);font-weight:400;text-align:left;padding:12px 14px}
.band th:last-child{text-align:right}
thead tr.cols th{font-weight:500;padding:16px 8px 10px;text-align:center;vertical-align:bottom}
td,th{padding:12px 8px}
tbody td{text-align:center}
tbody th{text-align:left;font-weight:500;padding-left:14px;white-space:nowrap}
tr.g td,tr.g th{background:var(--row)}
tr.sec td{text-align:center;font-weight:500;background:var(--bg);border-top:2px solid var(--line)}
tr.sec+tr td,tr.sec+tr th{border-top:1px solid var(--line)}
tbody{border-bottom:2px solid var(--line)}
.pesos th,.pesos td{border-top:2px solid var(--line)}
td.diverge{background:var(--bad-bg)!important;color:var(--bad-fg);font-weight:500}
sup{font-size:.7em}
.foot{margin-top:10px;font-size:.88rem;color:var(--muted);display:flex;gap:24px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>A economia segundo o IBC-Br</h1>
  <div class="ctrl">
    <label for="ano">Ano</label><select id="ano"></select>
    <label for="mes">Mês</label><select id="mes"></select>
    <button id="reload" type="button">Recarregar dados</button>
    <label for="tema" class="push">Tema</label>
    <select id="tema">
      <option value="auto">Automático</option>
      <option value="light">Claro</option>
      <option value="dark">Escuro</option>
    </select>
  </div>
  <div id="status" role="status" aria-live="polite">Carregando…</div>
  <div class="tbl"><table id="tabela"></table></div>
  <div class="foot">
    <span><sup>a</sup> Séries com ajuste sazonal</span>
    <span>Fonte: BCB/SGS (dados revisados atuais)</span>
  </div>
</div>
<script>
/* ===================================================================
   Tabela "A economia segundo o IBC-Br" reconstruída a partir do SGS.

   Séries (SA = com ajuste sazonal, NSA = sem ajuste):
     IBC-Br 24364/24363 · Agropecuária 29602/29601 · Indústria 29604/29603
     Serviços 29606/29605 · Impostos 29610/29609 · Ex-agropecuária 29608/29607

   Fórmulas (mês de referência m, ano y; variações em %):
     Mês/mês(-1)   SA:  x[m] / x[m-1]
     Tri/tri(-1)   SA:  média(m-2..m) / média(m-5..m-3)
     Carreg. trim. SA:  média do trimestre de m, completando os meses que
                        faltam com x[m] / média do trimestre anterior
     Carreg. anual SA:  média do ano y, completando os meses que faltam
                        com x[m] / média do ano y-1
     Mês/mês(-12)  NSA: x[m] / x[m-12]
     Tri/tri(-4)   NSA: média(m-2..m) / mesma janela 12 meses antes
     Ano corrente  NSA: soma(jan..m de y) / soma(jan..m de y-1)
     Acum. 12m     NSA: soma(m-11..m) / soma(m-23..m-12)
   Arredondamento: 1 casa, meio para longe do zero.

   Carga: para cada mês exibido baixa só a janela necessária
   (m-23 até m) das 12 séries e guarda no localStorage por CACHE_TTL_MS.
   =================================================================== */

const COLUNAS = [
  {nome:"IBC-Br",           rotulo:["IBC-Br"],                codNSA:24363, codSA:24364, peso:100.0},
  {nome:"Agropecuária",     rotulo:["Agropecuária"],          codNSA:29601, codSA:29602, peso:6.1},
  {nome:"Indústria",        rotulo:["Indústria"],             codNSA:29603, codSA:29604, peso:20.2},
  {nome:"Serviços",         rotulo:["Serviços"],              codNSA:29605, codSA:29606, peso:59.7},
  {nome:"Impostos",         rotulo:["Impostos"],              codNSA:29609, codSA:29610, peso:14.0},
  {nome:"IBC-Br ex-agropecuária", rotulo:["IBC-Br","ex-agropec."], codNSA:29607, codSA:29608, peso:93.9},
];
const TODAS_SERIES = COLUNAS.flatMap(c => [c.codNSA, c.codSA]);
const ANO_DOS_PESOS = 2026;            // "Pesos 2025" valem para os meses de 2026
const PRIMEIRO_MES = {ano:2005, mes:1}; // antes disso falta histórico para o acumulado 12m
const TIMEOUT_MS = 20000;
const CACHE_TTL_MS = 24*60*60*1000;     // revisões saem a cada divulgação; 1 dia basta
const CACHE_PREFIXO = "ibcbr:v2:";
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

/* Valores oficiais de julho/2026 (site do BCB), usados como autoteste:
   ao exibir esse mês, células que divergem ficam destacadas. */
const REFERENCIA_OFICIAL = {
  chave:"2026-07",
  linhas:{
    mm1 :[-0.2,-1.2,-0.4, 0.0,-0.2,-0.1],
    tt1 :[-0.3,-0.6,-0.5,-0.2,-0.6,-0.3],
    carQ:[-0.7,-0.8,-1.4,-0.3,-0.9,-0.8],
    carY:[ 1.2, 2.0, 0.4, 1.6, 0.9, 1.2],
    mm12:[ 1.1, 3.7, 0.5, 1.3, 0.7, 1.0],
    tt4 :[ 1.5, 3.8, 0.7, 1.6, 1.2, 1.4],
    ano :[ 1.5, 1.4, 0.7, 2.0, 1.1, 1.6],
    a12 :[ 1.5, 2.3, 0.7, 1.9, 0.7, 1.5],
  }
};

const $ = id => document.getElementById(id);

/* ---------- datas ---------- */
// Normaliza (ano, mês) com mês fora de 1..12 e devolve "AAAA-MM".
function chaveMes(ano, mes){
  const total = ano*12 + (mes-1);
  const a = Math.floor(total/12), m = total - a*12 + 1;
  return a + "-" + String(m).padStart(2,"0");
}
const anoDe = ch => +ch.slice(0,4);
const mesDe = ch => +ch.slice(5,7);
const paraSGS = ch => `01/${ch.slice(5,7)}/${ch.slice(0,4)}`;

/* ---------- armazenamento local (falhas são ignoradas) ---------- */
function lerCache(chave){
  try{
    const bruto = localStorage.getItem(CACHE_PREFIXO + chave);
    if(!bruto) return null;
    const obj = JSON.parse(bruto);
    return (Date.now() - obj.salvoEm < CACHE_TTL_MS) ? obj.dados : null;
  }catch{ return null; }
}
function gravarCache(chave, dados){
  try{ localStorage.setItem(CACHE_PREFIXO + chave, JSON.stringify({salvoEm:Date.now(), dados})); }catch{}
}
function removerCache(chave){
  try{ localStorage.removeItem(CACHE_PREFIXO + chave); }catch{}
}

/* ---------- acesso ao SGS ---------- */
async function buscarJSON(url){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try{
    const res = await fetch(url, {signal:ctrl.signal});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const js = await res.json();
    if(!Array.isArray(js)) throw new Error("resposta inesperada");
    return js;
  }catch(e){
    throw new Error(e.name === "AbortError" ? "tempo esgotado" : e.message);
  }finally{ clearTimeout(timer); }
}
// Converte [{data:"dd/mm/aaaa", valor:"123.45"}] em {"AAAA-MM": número}, descartando valores inválidos.
function converterSerie(lista){
  const out = {};
  for(const d of lista){
    const partes = String(d.data).split("/");
    const v = Number(d.valor);
    if(partes.length === 3 && Number.isFinite(v)) out[`${partes[2]}-${partes[1]}`] = v;
  }
  return out;
}

// Último mês disponível em TODAS as séries (evita oferecer mês com coluna vazia).
async function ultimoMesComum(){
  const emCache = lerCache("ultimo");
  if(emCache) return emCache;
  const res = await Promise.allSettled(TODAS_SERIES.map(cod =>
    buscarJSON(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${cod}/dados/ultimos/1?formato=json`)));
  const chaves = res.filter(r => r.status === "fulfilled").map(r => Object.keys(converterSerie(r.value))[0]).filter(Boolean);
  if(!chaves.length) throw new Error(res.find(r => r.status === "rejected")?.reason?.message || "sem dados");
  const ultimo = chaves.sort()[0];
  if(chaves.length === TODAS_SERIES.length) gravarCache("ultimo", ultimo);
  return ultimo;
}

// Janela m-23..m de todas as séries. Devolve {dados:{cod:{chave:valor}}, falhas:[cod]}.
async function carregarJanela(chave){
  const emCache = lerCache("janela:" + chave);
  if(emCache) return {dados:emCache, falhas:[]};
  const ini = paraSGS(chaveMes(anoDe(chave), mesDe(chave)-23)), fim = paraSGS(chave);
  const res = await Promise.allSettled(TODAS_SERIES.map(cod =>
    buscarJSON(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${cod}/dados?formato=json&dataInicial=${ini}&dataFinal=${fim}`)));
  const dados = {}, falhas = [];
  res.forEach((r, i) => {
    if(r.status === "fulfilled") dados[TODAS_SERIES[i]] = converterSerie(r.value);
    else falhas.push(TODAS_SERIES[i]);
  });
  if(!falhas.length) gravarCache("janela:" + chave, dados);
  return {dados, falhas};
}

/* ---------- cálculo ---------- */
const media = v => v.some(x => x == null) ? null : v.reduce((s,x) => s+x, 0)/v.length;
const soma  = v => v.some(x => x == null) ? null : v.reduce((s,x) => s+x, 0);
const variacao = (atual, base) => (atual == null || base == null) ? null : (atual/base - 1)*100;

function calcularColuna(serieSA, serieNSA, ano, mes){
  const sa  = (a,m) => serieSA?.[chaveMes(a,m)] ?? null;
  const nsa = (a,m) => serieNSA?.[chaveMes(a,m)] ?? null;
  // n meses terminando em (a, m)
  const janela = (fn, a, m, n) => Array.from({length:n}, (_,i) => fn(a, m-n+1+i));

  const inicioTri = Math.floor((mes-1)/3)*3 + 1;
  const triAtual = [0,1,2].map(i => inicioTri+i <= mes ? sa(ano, inicioTri+i) : sa(ano, mes));
  const anoAtual = Array.from({length:12}, (_,i) => i+1 <= mes ? sa(ano, i+1) : sa(ano, mes));

  return {
    mm1 : variacao(sa(ano,mes), sa(ano,mes-1)),
    tt1 : variacao(media(janela(sa,ano,mes,3)), media(janela(sa,ano,mes-3,3))),
    carQ: variacao(media(triAtual), media(janela(sa,ano,inicioTri-1,3))),
    carY: variacao(media(anoAtual), media(janela(sa,ano-1,12,12))),
    mm12: variacao(nsa(ano,mes), nsa(ano-1,mes)),
    tt4 : variacao(media(janela(nsa,ano,mes,3)), media(janela(nsa,ano-1,mes,3))),
    ano : variacao(soma(janela(nsa,ano,mes,mes)), soma(janela(nsa,ano-1,mes,mes))),
    a12 : variacao(soma(janela(nsa,ano,mes,12)), soma(janela(nsa,ano,mes-12,12))),
  };
}

/* ---------- formatação ---------- */
const FORMATO = new Intl.NumberFormat("pt-BR", {minimumFractionDigits:1, maximumFractionDigits:1});
// 1 casa, meio para longe do zero (-0,25 → -0,3); epsilon corrige erro de ponto flutuante.
const arredondar = v => Math.sign(v) * Math.round(Math.abs(v)*10 + 1e-9) / 10;
const formatar = v => {
  if(v == null) return "–";
  const r = arredondar(v);
  return FORMATO.format(Object.is(r, -0) ? 0 : r);
};

/* ---------- renderização (só números formatados e rótulos fixos entram no HTML) ---------- */
function renderizar(ano, mes, dados){
  const resultados = COLUNAS.map(c => calcularColuna(dados[c.codSA], dados[c.codNSA], ano, mes));
  const chave = chaveMes(ano, mes);
  const ref = chave === REFERENCIA_OFICIAL.chave ? REFERENCIA_OFICIAL.linhas : null;
  let divergencias = 0;

  const tri = Math.ceil(mes/3);
  const triAnterior = tri === 1 ? `${ano-1}T4` : `${ano}T${tri-1}`;

  const linha = (rotulo, campo) => `<tr class="g"><th scope="row">${rotulo}</th>${resultados.map((r,i) => {
    const valor = r[campo];
    const diverge = ref && valor != null && arredondar(valor) !== ref[campo][i];
    if(diverge) divergencias++;
    return diverge
      ? `<td class="diverge" title="Oficial: ${formatar(ref[campo][i])}">${formatar(valor)}</td>`
      : `<td>${formatar(valor)}</td>`;
  }).join("")}</tr>`;
  const secao = texto => `<tr class="sec"><td colspan="7">${texto}</td></tr>`;
  const pesos = ano === ANO_DOS_PESOS
    ? `<tr class="g pesos"><th scope="row">Pesos ${ANO_DOS_PESOS-1}</th>${COLUNAS.map(c => `<td>${formatar(c.peso)}</td>`).join("")}</tr>`
    : "";

  $("tabela").innerHTML = `
  <caption>IBC-Br, ${MESES[mes-1]} de ${ano}, variações em %</caption>
  <thead>
    <tr class="band"><th colspan="6" scope="colgroup">${MESES[mes-1]} de ${ano}</th><th>%</th></tr>
    <tr class="cols"><td></td>${COLUNAS.map(c => `<th scope="col">${c.rotulo.join("<br>")}</th>`).join("")}</tr>
  </thead>
  <tbody>
    ${pesos}
    ${secao("Variação em relação ao período anterior <sup>a</sup>")}
    ${linha("Mês/mês(-1)","mm1")}${linha("Tri/tri(-1)","tt1")}
    ${secao("Carregamento estatístico <sup>a</sup>")}
    ${linha(`${ano}T${tri}/${triAnterior}`,"carQ")}${linha(`${ano}/${ano-1}`,"carY")}
    ${secao("Variação em relação ao mesmo período do ano anterior")}
    ${linha("Mês/mês(-12)","mm12")}${linha("Tri/tri(-4)","tt4")}${linha("Ano corrente","ano")}${linha("Acumulado 12 meses","a12")}
  </tbody>`;
  return divergencias;
}

/* ---------- controles ---------- */
let ultimoDisponivel = null;
let geracao = 0; // descarta respostas de cargas antigas (cliques repetidos)

function travar(sim){ ["ano","mes","reload"].forEach(id => $(id).disabled = sim); }

function preencherAnos(){
  const anos = [];
  for(let a = PRIMEIRO_MES.ano; a <= anoDe(ultimoDisponivel); a++) anos.push(a);
  $("ano").innerHTML = anos.map(a => `<option value="${a}">${a}</option>`).join("");
}
function preencherMeses(mesPreferido){
  const ano = +$("ano").value;
  const ate = ano === anoDe(ultimoDisponivel) ? mesDe(ultimoDisponivel) : 12;
  const de  = ano === PRIMEIRO_MES.ano ? PRIMEIRO_MES.mes : 1;
  const meses = []; for(let m = de; m <= ate; m++) meses.push(m);
  $("mes").innerHTML = meses.map(m => `<option value="${m}">${MESES[m-1]}</option>`).join("");
  $("mes").value = meses.includes(mesPreferido) ? mesPreferido : meses[meses.length-1];
}

async function mostrarSelecionado(){
  const ano = +$("ano").value, mes = +$("mes").value;
  const minha = ++geracao;
  travar(true);
  $("status").textContent = `Carregando ${MESES[mes-1].toLowerCase()} de ${ano}…`;
  try{
    const {dados, falhas} = await carregarJanela(chaveMes(ano, mes));
    if(minha !== geracao) return;
    const divergencias = renderizar(ano, mes, dados);
    const partes = [`Último dado disponível: ${MESES[mesDe(ultimoDisponivel)-1].toLowerCase()} de ${anoDe(ultimoDisponivel)}.`];
    if(falhas.length){
      const nomes = COLUNAS.filter(c => falhas.includes(c.codSA) || falhas.includes(c.codNSA)).map(c => c.nome);
      partes.push(`Falha ao baixar: ${nomes.join(", ")} (células com "–"). Clique em Recarregar.`);
    }
    if(chaveMes(ano,mes) === REFERENCIA_OFICIAL.chave){
      partes.push(divergencias
        ? `Autoteste: ${divergencias} célula(s) diferem do valor oficial (destacadas; passe o mouse para ver o oficial).`
        : "Autoteste: todos os valores conferem com a divulgação oficial.");
    }
    $("status").textContent = partes.join(" ");
  }catch(e){
    if(minha === geracao) $("status").textContent = `Não foi possível carregar os dados (${e.message}). Clique em Recarregar.`;
  }finally{
    if(minha === geracao) travar(false);
  }
}

async function iniciar(){
  travar(true);
  $("status").textContent = "Consultando o último mês disponível…";
  try{
    const mesAnterior = +$("mes").value || null, anoAnterior = +$("ano").value || null;
    ultimoDisponivel = await ultimoMesComum();
    preencherAnos();
    $("ano").value = anoAnterior && anoAnterior <= anoDe(ultimoDisponivel) ? anoAnterior : anoDe(ultimoDisponivel);
    preencherMeses(mesAnterior ?? mesDe(ultimoDisponivel));
    await mostrarSelecionado();
  }catch(e){
    $("status").textContent = `Não foi possível acessar o SGS (${e.message}). Verifique a conexão e clique em Recarregar.`;
    $("reload").disabled = false;
  }
}

/* ---------- tema ---------- */
const sistemaEscuro = window.matchMedia("(prefers-color-scheme: dark)");
function aplicarTema(){
  const escolha = $("tema").value;
  const efetivo = escolha === "auto" ? (sistemaEscuro.matches ? "dark" : "light") : escolha;
  document.documentElement.setAttribute("data-theme", efetivo);
}
try{ $("tema").value = localStorage.getItem("ibcbr:tema") || "auto"; }catch{}
aplicarTema();
$("tema").addEventListener("change", () => {
  try{ localStorage.setItem("ibcbr:tema", $("tema").value); }catch{}
  aplicarTema();
});
sistemaEscuro.addEventListener("change", aplicarTema);

/* ---------- eventos ---------- */
$("ano").addEventListener("change", () => { preencherMeses(+$("mes").value); mostrarSelecionado(); });
$("mes").addEventListener("change", mostrarSelecionado);
// Recarregar: descarta só o cache do mês exibido e baixa esse mês de novo.
// Se a carga inicial falhou (sem último mês conhecido), refaz a inicialização.
$("reload").addEventListener("click", () => {
  if(!ultimoDisponivel) return iniciar();
  removerCache("janela:" + chaveMes(+$("ano").value, +$("mes").value));
  mostrarSelecionado();
});
iniciar();
</script>
</body>
</html>
