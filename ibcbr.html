<!doctype html>
<html lang="pt-BR">
<head>

<title>IBC-Br por mês</title>
<script>
// Aplica o tema antes da primeira pintura (evita flash claro no modo escuro).
try{
  const t = localStorage.getItem("ibcbr:tema") || "auto";
  document.documentElement.dataset.theme = t === "auto"
    ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
}catch{}
</script>
<style>
/* Layout: título, barra de controles, tabela no padrão visual do site do BCB.
   Tema: o script sempre define data-theme="light"|"dark" no <html>
   (no modo Automático, segue o sistema), então só existe um bloco de cores escuras. */
:root{
  --bg:#ffffff; --fg:#3b3b3b; --muted:#6b7378;
  --band:#0f5d70; --band-fg:#ffffff;
  --row:#f1f1f1; --line:#9fbfc8;
  /* Ubuntu só é usada se estiver instalada localmente (sem fontes externas). */
  --font:"Ubuntu","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#15191b; --fg:#e3e6e7; --muted:#9aa4a8;
  --band:#0f5d70; --band-fg:#ffffff;
  --row:#1f2527; --line:#3b5c66;
  color-scheme:dark;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px}
h1{font-weight:500;font-size:1.5rem;margin:0 0 16px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:8px}
.ctrl .push{margin-left:auto}
select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
button{cursor:pointer}
select:disabled,button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--band);outline-offset:2px}
#status{color:var(--muted);font-size:.9rem;min-height:1.4em;margin-bottom:12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.band th{background:var(--band);color:var(--band-fg);font-weight:400;text-align:left;padding:12px 14px}
.band th:last-child{text-align:right}
thead tr.cols th{font-weight:500;padding:16px 8px 10px;text-align:center;vertical-align:bottom}
td,th{padding:12px 8px}
tbody td{text-align:center}
tbody th{text-align:left;font-weight:500;padding-left:14px;white-space:nowrap}
tr.g td,tr.g th{background:var(--row)}
tr.sec th{text-align:center;font-weight:500;background:var(--bg);border-top:2px solid var(--line)}
tr.sec+tr td,tr.sec+tr th{border-top:1px solid var(--line)}
tbody{border-bottom:2px solid var(--line)}
.pesos th,.pesos td{border-top:2px solid var(--line)}
sup{font-size:.7em}
.foot{margin-top:10px;font-size:.88rem;color:var(--muted);display:flex;gap:24px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>A economia segundo o IBC-Br</h1>
  <div class="ctrl">
    <label for="ano">Ano</label><select id="ano"></select>
    <label for="mes">Mês</label><select id="mes"></select>
    <button id="reload" type="button">Recarregar dados</button>
    <label for="tema" class="push">Tema</label>
    <select id="tema">
      <option value="auto">Automático</option>
      <option value="light">Claro</option>
      <option value="dark">Escuro</option>
    </select>
  </div>
  <div id="status" role="status" aria-live="polite">Carregando…</div>
  <div class="tbl"><table id="tabela"></table></div>
  <div class="foot">
    <span><sup>a</sup> Séries com ajuste sazonal</span>
    <span>Fonte: BCB/SGS (dados revisados atuais)</span>
    <span id="versao"></span>
  </div>
</div>

<!-- Bloco "calc": só funções puras, sem DOM nem rede. O teste em tests/ibcbr.test.mjs
     extrai e executa este bloco; mantenha-o autocontido. -->
<script id="calc">
/* ===================================================================
   Tabela "A economia segundo o IBC-Br" reconstruída a partir do SGS.

   Séries (SA = com ajuste sazonal, NSA = sem ajuste):
     IBC-Br 24364/24363 · Agropecuária 29602/29601 · Indústria 29604/29603
     Serviços 29606/29605 · Impostos 29610/29609 · Ex-agropecuária 29608/29607

   Fórmulas (mês de referência m, ano y; variações em %), com o nome do
   campo devolvido por calcularColuna entre colchetes:
     [varMes]     Mês/mês(-1)   SA:  x[m] / x[m-1]
     [varTri]     Tri/tri(-1)   SA:  média(m-2..m) / média(m-5..m-3)
     [carregTri]  Carreg. trim. SA:  média do trimestre de m, completando os
                                     meses que faltam com x[m] / média do
                                     trimestre anterior
     [carregAno]  Carreg. anual SA:  média do ano y, completando os meses que
                                     faltam com x[m] / média do ano y-1
     [varMes12]   Mês/mês(-12)  NSA: x[m] / x[m-12]
     [varTri4]    Tri/tri(-4)   NSA: média(m-2..m) / mesma janela 12 meses antes
     [varAno]     Ano corrente  NSA: soma(jan..m de y) / soma(jan..m de y-1)
     [acum12]     Acum. 12m     NSA: soma(m-11..m) / soma(m-23..m-12)
   Arredondamento: 1 casa, meio para longe do zero.
   =================================================================== */

const COLUNAS = [
  {nome:"IBC-Br",                 rotulo:["IBC-Br"],                codNSA:24363, codSA:24364},
  {nome:"Agropecuária",           rotulo:["Agropecuária"],          codNSA:29601, codSA:29602},
  {nome:"Indústria",              rotulo:["Indústria"],             codNSA:29603, codSA:29604},
  {nome:"Serviços",               rotulo:["Serviços"],              codNSA:29605, codSA:29606},
  {nome:"Impostos",               rotulo:["Impostos"],              codNSA:29609, codSA:29610},
  {nome:"IBC-Br ex-agropecuária", rotulo:["IBC-Br","ex-agropec."],  codNSA:29607, codSA:29608},
];
const TODAS_SERIES = COLUNAS.flatMap(c => [c.codNSA, c.codSA]);

// Pesos por ano de exibição, na ordem de COLUNAS. Os "Pesos AAAA-1" da tabela
// oficial do BCB valem para os meses de AAAA. Acrescente um ano por vez,
// copiando da tabela publicada; anos ausentes simplesmente não mostram a linha.
const PESOS_POR_ANO = {
  2026: [100.0, 6.1, 20.2, 59.7, 14.0, 93.9],
};

/* ---------- datas ---------- */
// Normaliza (ano, mês) com mês fora de 1..12 e devolve "AAAA-MM".
function chaveMes(ano, mes){
  const total = ano*12 + (mes-1);
  const a = Math.floor(total/12), m = total - a*12 + 1;
  return a + "-" + String(m).padStart(2,"0");
}
const anoDe = ch => +ch.slice(0,4);
const mesDe = ch => +ch.slice(5,7);

/* ---------- conversão da resposta do SGS ---------- */
// Converte [{data:"dd/mm/aaaa", valor:"123.45"}] em {"AAAA-MM": número}.
// Descarta valor vazio/nulo (Number("") seria 0) e não positivo (são índices).
function converterSerie(lista){
  const out = {};
  for(const d of lista){
    const partes = String(d?.data ?? "").split("/");
    const bruto = String(d?.valor ?? "").trim();
    const v = bruto === "" ? NaN : Number(bruto);
    if(partes.length === 3 && Number.isFinite(v) && v > 0) out[`${partes[2]}-${partes[1]}`] = v;
  }
  return out;
}

/* ---------- intervalos de meses baixados ---------- */
// Intervalos são pares [ini, fim] de chaves "AAAA-MM", inclusivos.
const indiceMes = ch => anoDe(ch)*12 + mesDe(ch) - 1;
const deIndice  = i  => chaveMes(Math.floor(i/12), i%12 + 1);

// Une intervalos sobrepostos ou adjacentes; devolve lista ordenada.
function unirIntervalos(lista){
  const ord = lista.map(([a,b]) => [indiceMes(a), indiceMes(b)]).sort((x,y) => x[0]-y[0]);
  const out = [];
  for(const [a,b] of ord){
    const u = out[out.length-1];
    if(u && a <= u[1] + 1) u[1] = Math.max(u[1], b); else out.push([a,b]);
  }
  return out.map(([a,b]) => [deIndice(a), deIndice(b)]);
}
// true se [ini, fim] está inteiramente dentro de um dos intervalos (já unidos).
const cobre = (intervalos, ini, fim) =>
  (intervalos || []).some(([a,b]) => a <= ini && fim <= b);

// Meses necessários para exibir (ano, mes): de m-23 até m (pior caso: acumulado 12m).
const janelaNecessaria = (ano, mes) => [chaveMes(ano, mes-23), chaveMes(ano, mes)];

// Faixa a baixar quando o usuário abre um mês não coberto: os 5 anos de y-2 a y+2,
// mais os 2 anos anteriores que os meses de y-2 precisam, limitada ao início das
// séries e ao último mês disponível. Fica dentro do limite de 10 anos do SGS.
function faixaAoRedor(ano, ultimo, inicio = "2003-01"){
  const ini = chaveMes(ano - 4, 1), fim = chaveMes(ano + 2, 12);
  return [ini < inicio ? inicio : ini, fim > ultimo ? ultimo : fim];
}

/* ---------- cálculo ---------- */
const media = v => v.some(x => x == null) ? null : v.reduce((s,x) => s+x, 0)/v.length;
const soma  = v => v.some(x => x == null) ? null : v.reduce((s,x) => s+x, 0);
const variacao = (atual, base) => (atual == null || base == null) ? null : (atual/base - 1)*100;

function calcularColuna(serieSA, serieNSA, ano, mes){
  const sa  = (a,m) => serieSA?.[chaveMes(a,m)] ?? null;
  const nsa = (a,m) => serieNSA?.[chaveMes(a,m)] ?? null;
  // n meses terminando em (a, m)
  const janela = (fn, a, m, n) => Array.from({length:n}, (_,i) => fn(a, m-n+1+i));

  const inicioTri = Math.floor((mes-1)/3)*3 + 1;
  const triAtual = [0,1,2].map(i => inicioTri+i <= mes ? sa(ano, inicioTri+i) : sa(ano, mes));
  const anoAtual = Array.from({length:12}, (_,i) => i+1 <= mes ? sa(ano, i+1) : sa(ano, mes));

  return {
    varMes   : variacao(sa(ano,mes), sa(ano,mes-1)),
    varTri   : variacao(media(janela(sa,ano,mes,3)), media(janela(sa,ano,mes-3,3))),
    carregTri: variacao(media(triAtual), media(janela(sa,ano,inicioTri-1,3))),
    carregAno: variacao(media(anoAtual), media(janela(sa,ano-1,12,12))),
    varMes12 : variacao(nsa(ano,mes), nsa(ano-1,mes)),
    varTri4  : variacao(media(janela(nsa,ano,mes,3)), media(janela(nsa,ano-1,mes,3))),
    varAno   : variacao(soma(janela(nsa,ano,mes,mes)), soma(janela(nsa,ano-1,mes,mes))),
    acum12   : variacao(soma(janela(nsa,ano,mes,12)), soma(janela(nsa,ano,mes-12,12))),
  };
}

/* ---------- formatação ---------- */
const FORMATO = new Intl.NumberFormat("pt-BR", {minimumFractionDigits:1, maximumFractionDigits:1});
// 1 casa, meio para longe do zero (-0,25 → -0,3); epsilon corrige erro de ponto flutuante.
const arredondar = v => Math.sign(v) * Math.round(Math.abs(v)*10 + 1e-9) / 10;
const formatar = v => {
  if(v == null || !Number.isFinite(v)) return "–";
  const r = arredondar(v);
  return FORMATO.format(Object.is(r, -0) ? 0 : r);
};
</script>

<script>
/* Carga sob demanda:
   - Ao abrir: 1 requisição por série traz o último mês e o que todos os meses do
     ano dele precisam (ver carregarInicio). A página sempre abre no último mês.
   - Ao escolher um mês cuja janela (m-23..m) ainda não foi baixada: baixa os 5 anos
     ao redor dele (ver faixaAoRedor), 1 requisição por série.
   Cada série fica no localStorage com os intervalos já baixados, por CACHE_TTL_MS. */

const VERSAO = document.querySelector('meta[name="version"]').content; // fonte única: <meta name="version">
const INICIO_SERIES = "2003-01";         // primeiro mês das séries no SGS
const PRIMEIRO_MES = {ano:2005, mes:1};  // antes disso falta histórico para o acumulado 12m
const TIMEOUT_MS = 20000;
const CACHE_TTL_MS = 24*60*60*1000;      // revisões saem a cada divulgação; 1 dia basta
const CACHE_PREFIXO = "ibcbr:v4:";
const CHAVE_TEMA = "ibcbr:tema";
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const URL_SGS = cod => `https://api.bcb.gov.br/dados/serie/bcdata.sgs.${cod}/dados`;
const paraSGS = ch => `01/${ch.slice(5,7)}/${ch.slice(0,4)}`;

const $ = id => document.getElementById(id);
$("versao").textContent = `Versão ${VERSAO}`;

/* ---------- armazenamento local (falhas são ignoradas) ---------- */
function lerCache(chave){
  try{
    const bruto = localStorage.getItem(CACHE_PREFIXO + chave);
    if(!bruto) return null;
    const obj = JSON.parse(bruto);
    return (Date.now() - obj.salvoEm < CACHE_TTL_MS) ? obj : null;
  }catch{ return null; }
}
// salvoEm é preservado ao acrescentar intervalos, para a série inteira vencer junta.
function gravarCache(chave, dados, salvoEm = Date.now()){
  try{ localStorage.setItem(CACHE_PREFIXO + chave, JSON.stringify({salvoEm, dados})); }catch{}
}
// Remove entradas vencidas, ilegíveis ou de versões antigas do cache.
// tudo=true: remove todo o cache de dados (usado pelo Recarregar). O tema é preservado.
function limparCache(tudo = false){
  try{
    for(let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i);
      if(!k?.startsWith("ibcbr:") || k === CHAVE_TEMA) continue;
      if(tudo || !k.startsWith(CACHE_PREFIXO)){ localStorage.removeItem(k); continue; }
      try{ if(!(Date.now() - JSON.parse(localStorage.getItem(k)).salvoEm < CACHE_TTL_MS)) localStorage.removeItem(k); }
      catch{ localStorage.removeItem(k); }
    }
  }catch{}
}

/* ---------- acesso ao SGS ---------- */
async function buscarJSON(url){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try{
    const res = await fetch(url, {signal:ctrl.signal});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const js = await res.json();
    if(!Array.isArray(js)) throw new Error("resposta inesperada do SGS");
    return js;
  }catch(e){
    if(e.name === "AbortError") throw new Error("tempo esgotado");
    if(e instanceof SyntaxError) throw new Error("resposta inválida do SGS"); // ex.: página HTML de erro
    throw e;
  }finally{ clearTimeout(timer); }
}

/* ---------- estado das séries ----------
   series[cod] = {valores:{"AAAA-MM":n}, intervalos:[[ini,fim]], ultimo:"AAAA-MM"|null, salvoEm} */
const series = {};

function carregarDoCache(){
  for(const cod of TODAS_SERIES){
    const obj = lerCache("serie:" + cod);
    series[cod] = obj ? {...obj.dados, salvoEm:obj.salvoEm} : {valores:{}, intervalos:[], ultimo:null, salvoEm:undefined};
  }
}
function incorporar(cod, valores, ini, fim, ultimo){
  const s = series[cod];
  Object.assign(s.valores, valores);
  s.intervalos = unirIntervalos([...s.intervalos, [ini, fim]]);
  if(ultimo) s.ultimo = ultimo;
  s.salvoEm ??= Date.now();
  const {salvoEm, ...dados} = s;
  gravarCache("serie:" + cod, dados, salvoEm);
}

// Executa fn para cada série em paralelo; devolve as que falharam e a primeira mensagem.
async function paraCadaSerie(cods, fn){
  const res = await Promise.allSettled(cods.map(fn));
  const falhas = cods.filter((_, i) => res[i].status === "rejected");
  return {falhas, erro: res.find(r => r.status === "rejected")?.reason?.message};
}

// Carga inicial: de janeiro de (ano atual - 2) até o último dado. Cobre a janela
// (m-23..m) de todos os meses do ano do último dado, mesmo no início do ano,
// quando o último dado ainda é do ano anterior. Só para séries sem "ultimo" no cache.
function carregarInicio(){
  const ini = chaveMes(new Date().getFullYear() - 2, 1);
  return paraCadaSerie(TODAS_SERIES.filter(c => !series[c].ultimo), async cod => {
    const valores = converterSerie(await buscarJSON(`${URL_SGS(cod)}?formato=json&dataInicial=${paraSGS(ini)}`));
    const chaves = Object.keys(valores).sort();
    if(!chaves.length) throw new Error("sem dados");
    const ultimo = chaves[chaves.length-1];
    incorporar(cod, valores, ini, ultimo, ultimo);
  });
}

// Garante a janela de (ano, mes) em todas as séries; baixa os 5 anos ao redor onde faltar.
function garantirMes(ano, mes){
  const [ini, fim] = janelaNecessaria(ano, mes);
  const faltam = TODAS_SERIES.filter(c => !cobre(series[c].intervalos, ini, fim));
  const [de, ate] = faixaAoRedor(ano, ultimoDisponivel, INICIO_SERIES);
  return paraCadaSerie(faltam, async cod => {
    const url = `${URL_SGS(cod)}?formato=json&dataInicial=${paraSGS(de)}&dataFinal=${paraSGS(ate)}`;
    incorporar(cod, converterSerie(await buscarJSON(url)), de, ate);
  });
}

/* ---------- renderização (só números formatados e rótulos fixos entram no HTML) ---------- */
function renderizar(ano, mes){
  const resultados = COLUNAS.map(c => calcularColuna(series[c.codSA].valores, series[c.codNSA].valores, ano, mes));

  const tri = Math.ceil(mes/3);
  const triAnterior = tri === 1 ? `${ano-1}T4` : `${ano}T${tri-1}`;

  const linha = (rotulo, campo) => `<tr class="g"><th scope="row">${rotulo}</th>${resultados.map(r => `<td>${formatar(r[campo])}</td>`).join("")}</tr>`;
  const secao = texto => `<tr class="sec"><th scope="rowgroup" colspan="7">${texto}</th></tr>`;
  const pesosAno = PESOS_POR_ANO[ano];
  const pesos = pesosAno
    ? `<tr class="g pesos"><th scope="row">Pesos ${ano-1}</th>${pesosAno.map(p => `<td>${formatar(p)}</td>`).join("")}</tr>`
    : "";

  $("tabela").innerHTML = `
  <caption>IBC-Br, ${MESES[mes-1]} de ${ano}, variações em %</caption>
  <thead>
    <tr class="band"><th colspan="6" scope="colgroup">${MESES[mes-1]} de ${ano}</th><th>%</th></tr>
    <tr class="cols"><td></td>${COLUNAS.map(c => `<th scope="col">${c.rotulo.join("<br>")}</th>`).join("")}</tr>
  </thead>
  <tbody>
    ${pesos}
    ${secao("Variação em relação ao período anterior <sup>a</sup>")}
    ${linha("Mês/mês(-1)","varMes")}${linha("Tri/tri(-1)","varTri")}
    ${secao("Carregamento estatístico <sup>a</sup>")}
    ${linha(`${ano}T${tri}/${triAnterior}`,"carregTri")}${linha(`${ano}/${ano-1}`,"carregAno")}
    ${secao("Variação em relação ao mesmo período do ano anterior")}
    ${linha("Mês/mês(-12)","varMes12")}${linha("Tri/tri(-4)","varTri4")}${linha("Ano corrente","varAno")}${linha("Acumulado 12 meses","acum12")}
  </tbody>`;
}

/* ---------- controles ---------- */
let ultimoDisponivel = null;
let geracao = 0; // descarta resultados de cargas antigas (trocas rápidas de mês, cliques repetidos)

function travar(sim){ ["ano","mes","reload"].forEach(id => $(id).disabled = sim); }

function preencherAnos(){
  const anos = [];
  for(let a = PRIMEIRO_MES.ano; a <= anoDe(ultimoDisponivel); a++) anos.push(a);
  $("ano").innerHTML = anos.map(a => `<option value="${a}">${a}</option>`).join("");
}
function preencherMeses(mesPreferido){
  const ano = +$("ano").value;
  const ate = ano === anoDe(ultimoDisponivel) ? mesDe(ultimoDisponivel) : 12;
  const de  = ano === PRIMEIRO_MES.ano ? PRIMEIRO_MES.mes : 1;
  const meses = []; for(let m = de; m <= ate; m++) meses.push(m);
  $("mes").innerHTML = meses.map(m => `<option value="${m}">${MESES[m-1]}</option>`).join("");
  $("mes").value = meses.includes(mesPreferido) ? mesPreferido : meses[meses.length-1];
}

function mostrarStatus(falhas, erro){
  if(!falhas.length){ $("status").textContent = ""; return; }
  const nomes = COLUNAS.filter(c => falhas.includes(c.codSA) || falhas.includes(c.codNSA)).map(c => c.nome);
  $("status").textContent = `Falha ao baixar: ${nomes.join(", ")} (${erro}; células com "–"). Clique em Recarregar.`;
}

// Troca de mês: cálculo local; só vai à rede se a janela do mês ainda não foi baixada.
async function mostrarSelecionado(){
  const ano = +$("ano").value, mes = +$("mes").value;
  const minha = ++geracao;
  const [ini, fim] = janelaNecessaria(ano, mes);
  if(TODAS_SERIES.every(c => cobre(series[c].intervalos, ini, fim))){
    renderizar(ano, mes); mostrarStatus([]); return;
  }
  travar(true);
  $("status").textContent = `Baixando dados de ${ano-2} a ${Math.min(ano+2, anoDe(ultimoDisponivel))}…`;
  try{
    const {falhas, erro} = await garantirMes(ano, mes);
    if(minha !== geracao) return;
    renderizar(ano, mes);
    mostrarStatus(falhas, erro);
  }finally{
    if(minha === geracao) travar(false);
  }
}

async function iniciar(){
  const minha = ++geracao;
  travar(true);
  $("status").textContent = "Consultando o último mês disponível…";
  try{
    carregarDoCache();
    const {falhas, erro} = await carregarInicio();
    if(minha !== geracao) return;
    // Último mês comum às séries que responderam; a série que falhou aparece
    // com "–" e é baixada de novo no próximo Recarregar.
    const ultimos = TODAS_SERIES.map(c => series[c].ultimo).filter(Boolean);
    if(!ultimos.length) throw new Error(erro || "sem dados");
    ultimoDisponivel = ultimos.reduce((a,b) => a < b ? a : b);
    preencherAnos();
    $("ano").value = anoDe(ultimoDisponivel);   // sempre abre no último mês disponível
    preencherMeses(mesDe(ultimoDisponivel));
    renderizar(+$("ano").value, +$("mes").value);
    mostrarStatus(falhas, erro);
    travar(false);
  }catch(e){
    if(minha !== geracao) return;
    $("status").textContent = `Não foi possível acessar o SGS (${e.message}). Verifique a conexão e clique em Recarregar.`;
    travar(true);
    $("reload").disabled = false;
  }
}

/* ---------- tema (a aplicação inicial ocorre no <head>) ---------- */
const sistemaEscuro = window.matchMedia("(prefers-color-scheme: dark)");
function aplicarTema(){
  const escolha = $("tema").value;
  const efetivo = escolha === "auto" ? (sistemaEscuro.matches ? "dark" : "light") : escolha;
  document.documentElement.dataset.theme = efetivo;
}
try{ $("tema").value = localStorage.getItem(CHAVE_TEMA) || "auto"; }catch{}
aplicarTema();
$("tema").addEventListener("change", () => {
  try{ localStorage.setItem(CHAVE_TEMA, $("tema").value); }catch{}
  aplicarTema();
});
sistemaEscuro.addEventListener("change", aplicarTema);

/* ---------- eventos ---------- */
$("ano").addEventListener("change", () => { preencherMeses(+$("mes").value); mostrarSelecionado(); });
$("mes").addEventListener("change", mostrarSelecionado);
// Recarregar: descarta todo o cache de dados (inclusive o último mês) e baixa de novo,
// para que um mês recém-divulgado apareça na hora.
$("reload").addEventListener("click", () => { limparCache(true); iniciar(); });

limparCache();
iniciar();
</script>
