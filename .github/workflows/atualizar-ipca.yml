name: Atualizar IPCA

on:
  schedule:
    # 12:00 UTC (09:00 em Brasília) nos dias 9 a 14 de cada mês.
    # O IBGE divulga o IPCA por volta do dia 10; a janela cobre atrasos.
    - cron: '0 12 9-14 * *'
  workflow_dispatch:        # permite rodar na mão pela aba Actions

permissions:
  contents: write           # necessário para o commit de volta

concurrency:
  group: atualizar-ipca
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v5

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Testes do script (sem rede, sobre cópias temporárias). Se falharem,
      # nada é atualizado nem commitado.
      - name: Testes
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'   # sem __pycache__, que o "git add -A" levaria
        run: |
          python -m unittest discover -s testes -v

      # "shell: bash" explícito faz o Actions usar "bash -eo pipefail":
      # sem isso, uma falha do Python dentro do "| tee" passaria em silêncio.
      - name: Rodar o atualizador
        shell: bash
        run: |
          python atualizar_ipca.py | tee saida.txt

      # Confere se index.html corresponde à planilha e ao modelo.html.
      # Se falhar (ex.: o modelo perdeu o marcador e a página não foi gerada),
      # o job para aqui e nada é commitado.
      - name: Verificar planilha e página
        shell: bash
        run: |
          python atualizar_ipca.py --verificar

      # Compara toda a série com o número-índice oficial do IBGE (variável 2266)
      # ANTES do commit. Código 1 (divergência) interrompe: nada é publicado.
      # Código 2 (IBGE fora do ar) e 3 (resposta incompleta ou inesperada, com
      # anotação de erro no resumo) seguem, para um problema do IBGE não travar
      # a atualização.
      - name: Auditar contra o índice oficial do IBGE
        shell: bash
        run: |
          set +e
          python atualizar_ipca.py --auditar
          cod=$?
          if [ "$cod" -eq 2 ]; then
            echo "IBGE indisponível: auditoria não realizada; segue sem bloquear."
            exit 0
          fi
          if [ "$cod" -eq 3 ]; then
            echo "Auditoria incompleta (resposta do IBGE): segue sem bloquear; ver anotação de erro."
            exit 0
          fi
          exit $cod

      - name: Commitar se algo mudou
        shell: bash
        run: |
          MES=$(sed -n 's/.*Pagina gerada:.*ate \(.*\))$/\1/p' saida.txt | tail -1)
          rm -f saida.txt
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou: a série já estava no mês mais recente (${MES})."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "IPCA ${MES:-atualizado}"
          git push

